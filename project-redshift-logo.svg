<!-- ═══════════════ DIAMOND FRAME ═══════════════ -->
<polygon points="250,14 486,250 250,486 14,250"
         fill="none" stroke="#2a1638" stroke-width="0.7"/>
<polygon points="250,20 480,250 250,480 20,250"
         fill="none" stroke="#180e24" stroke-width="0.3"/>

<!-- Diamond corner accent ticks -->
<g stroke="#6a3562" stroke-width="1.1" fill="none" stroke-linecap="square">
  <line x1="245" y1="14"  x2="250" y2="5"/>
  <line x1="255" y1="14"  x2="250" y2="5"/>
  <line x1="486" y1="245" x2="495" y2="250"/>
  <line x1="486" y1="255" x2="495" y2="250"/>
  <line x1="245" y1="486" x2="250" y2="495"/>
  <line x1="255" y1="486" x2="250" y2="495"/>
  <line x1="14"  y1="245" x2="5"   y2="250"/>
  <line x1="14"  y1="255" x2="5"   y2="250"/>
</g>

<!-- ═══════════════ SPECTRAL SHIFT LINES ═══════════════ -->
<g mask="url(#sm)">
  <rect x="0" y="202" width="500" height="0.5" fill="url(#spec)" opacity="0.28"/>
  <rect x="0" y="210" width="500" height="0.6" fill="url(#spec)" opacity="0.40"/>
  <rect x="0" y="218" width="500" height="0.7" fill="url(#spec)" opacity="0.52"/>
  <rect x="0" y="227" width="500" height="0.9" fill="url(#spec)" opacity="0.62"/>
  <rect x="0" y="237" width="500" height="0.8" fill="url(#spec)" opacity="0.58"/>
  <rect x="0" y="248" width="500" height="0.7" fill="url(#spec)" opacity="0.48"/>
  <rect x="0" y="260" width="500" height="0.5" fill="url(#spec)" opacity="0.35"/>
  <rect x="0" y="273" width="500" height="0.4" fill="url(#spec)" opacity="0.20"/>
  <rect x="0" y="288" width="500" height="0.3" fill="url(#spec)" opacity="0.10"/>
</g>

<!-- ═══════════════ TYPOGRAPHY ═══════════════ -->

<!-- Hairline rule above PROJECT -->
<line x1="92" y1="152" x2="408" y2="152" stroke="#2a1535" stroke-width="0.4"/>

<!-- "PROJECT" — thin, condensed, ice-blue stroke -->
<text x="250" y="178"
      text-anchor="middle"
      font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif"
      font-size="34"
      font-weight="300"
      textLength="248"
      lengthAdjust="spacingAndGlyphs"
      fill="none"
      stroke="#7aaed0"
      stroke-width="0.7"
      filter="url(#bg2)">PROJECT</text>

<!-- Small diamond accent between texts -->
<polygon points="250,198 256,205 250,212 244,205"
         fill="none" stroke="#663355" stroke-width="0.9"/>

<!-- Thin horizontal rule pair -->
<line x1="88"  y1="152" x2="244" y2="152" stroke="#221030" stroke-width="0.3"/>
<line x1="256" y1="152" x2="412" y2="152" stroke="#221030" stroke-width="0.3"/>

<!-- "REDSHIFT" — large, angular, thin red stroke -->
<text x="250" y="342"
      text-anchor="middle"
      font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif"
      font-size="86"
      font-weight="700"
      textLength="430"
      lengthAdjust="spacingAndGlyphs"
      fill="none"
      stroke="#cc1100"
      stroke-width="1.6"
      filter="url(#rg)">REDSHIFT</text>

<!-- Hairline rules below REDSHIFT -->
<line x1="90"  y1="360" x2="410" y2="360" stroke="#2a1030" stroke-width="0.45"/>
<line x1="110" y1="366" x2="390" y2="366" stroke="#1a0820" stroke-width="0.3"/>

<!-- Tagline in tiny monospace -->
<text x="250" y="383"
      text-anchor="middle"
      font-family="'Courier New',Courier,monospace"
      font-size="8"
      letter-spacing="4.5"
      fill="#3d2248"
      opacity="0.95">UK · HARD ROCK · EST. MMXVI</text>

<!-- Outer border (very subtle) -->
<rect x="1" y="1" width="498" height="498"
      fill="none" stroke="#180e22" stroke-width="0.5"/>

</svg>
