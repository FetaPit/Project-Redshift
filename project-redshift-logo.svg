  <circle cx="42"  cy="58"  r="0.9" opacity="0.55"/>
  <circle cx="82"  cy="105" r="1.0" opacity="0.5"/>
  <circle cx="152" cy="78"  r="0.9" opacity="0.55"/>
  <circle cx="38"  cy="178" r="1.0" opacity="0.5"/>
