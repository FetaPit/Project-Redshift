<!-- Bright stars with lens flare -->
<g>
  <g transform="translate(88,72)" opacity="0.88">
    <circle r="2.2" fill="#ffffff" filter="url(#sg)"/>
    <circle r="1.4" fill="#ffffff"/>
    <line x1="-12" y1="0"  x2="12"  y2="0"  stroke="#ffffff" stroke-width="0.4" opacity="0.5"/>
    <line x1="0"   y1="-12" x2="0"  y2="12"  stroke="#ffffff" stroke-width="0.4" opacity="0.5"/>
    <line x1="-7"  y1="-7"  x2="7"  y2="7"   stroke="#ffffff" stroke-width="0.25" opacity="0.28"/>
    <line x1="7"   y1="-7"  x2="-7" y2="7"   stroke="#ffffff" stroke-width="0.25" opacity="0.28"/>
  </g>
  <g transform="translate(415,52)" opacity="0.82">
    <circle r="2" fill="#cce4ff" filter="url(#sg)"/>
    <circle r="1.3" fill="#cce4ff"/>
    <line x1="-10" y1="0"  x2="10" y2="0"  stroke="#cce4ff" stroke-width="0.35" opacity="0.45"/>
    <line x1="0"   y1="-10" x2="0" y2="10"  stroke="#cce4ff" stroke-width="0.35" opacity="0.45"/>
  </g>
  <g transform="translate(435,430)" opacity="0.78">
    <circle r="2.2" fill="#ffe8d8" filter="url(#sg)"/>
    <circle r="1.4" fill="#ffe8d8"/>
    <line x1="-11" y1="0"   x2="11" y2="0"  stroke="#ffe8d8" stroke-width="0.35" opacity="0.42"/>
    <line x1="0"   y1="-11" x2="0"  y2="11" stroke="#ffe8d8" stroke-width="0.35" opacity="0.42"/>
    <line x1="-7"  y1="-7"  x2="7"  y2="7"  stroke="#ffe8d8" stroke-width="0.2"  opacity="0.22"/>
    <line x1="7"   y1="-7"  x2="-7" y2="7"  stroke="#ffe8d8" stroke-width="0.2"  opacity="0.22"/>
  </g>
  <g transform="translate(42,390)" opacity="0.8">
    <circle r="1.8" fill="#aaccff" filter="url(#sg)"/>
